<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="./brand/mark.png" />
    <link rel="apple-touch-icon" href="./brand/mark.png" />
    <title>SamWORLD</title>
  </head>
  <body>
    <main id="stage"><div id="scene-container"></div><div id="stage-note" hidden></div><div id="stage-controls"></div></main>
    <div id="map" aria-label="Map. Tap a place to see listings nearby."></div>
    <div id="topbar">
      <button class="pill brand" data-action="home" aria-label="SamWORLD home"><img src="./brand/samworld-white.png" alt="SamWORLD" width="131" height="24" /></button>
      <div class="top-right">
        <span class="pill status" id="status-pill" hidden></span>
        <button class="pill" id="enter-xr" hidden></button>
      </div>
    </div>
    <aside id="panel" aria-label="Property panel">
      <div class="sheet-grip" role="button" aria-label="Resize panel"><span></span></div>
      <div id="panel-body"></div>
    </aside>
    <div id="splash" aria-label="Loading SamWORLD"><span class="mark-loader xl"><img src="./brand/mark.png" alt="" /></span><img class="splash-word" src="./brand/samworld.png" alt="SamWORLD" width="153" height="28" /></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
